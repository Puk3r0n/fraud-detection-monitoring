global:
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 5s

scrape_configs:
  - job_name: fraud_detector
    static_configs:
      - targets: ["fraud_detector:8000"]
        labels:
          service: scoring

  - job_name: scoring_writer
    static_configs:
      - targets: ["scoring_writer:8001"]
        labels:
          service: writer

  - job_name: node
    static_configs:
      - targets: ["docker-host:9100"]
        labels:
          service: host

  - job_name: prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]
